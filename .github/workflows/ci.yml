name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Installer les dépendances
        run: npm ci

      - name: Linter
        run: npm run lint

      - name: Tests
        run: npm test

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Build de l'image Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: taskflow:ci